name: Build QuickRecord

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # Your signing key, from the repository's secrets. Without it the APK is
      # signed with a throwaway debug key, which can't update your installed app.
      - name: Decode signing keystore
        env:
          QR_KEYSTORE_BASE64: ${{ secrets.QR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$QR_KEYSTORE_BASE64" ]; then
            echo "$QR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quickrecord.keystore"
          else
            echo "::warning::No QR_KEYSTORE_BASE64 secret: building with the debug key."
          fi

      - name: Build release APK
        env:
          QR_KEYSTORE_FILE: ${{ runner.temp }}/quickrecord.keystore
          QR_KEYSTORE_PASSWORD: ${{ secrets.QR_KEYSTORE_PASSWORD }}
          QR_KEY_ALIAS: ${{ secrets.QR_KEY_ALIAS }}
          QR_KEY_PASSWORD: ${{ secrets.QR_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VERSION="dev-${GITHUB_SHA::7}"; fi
          cp app/build/outputs/apk/release/app-release.apk "QuickRecord-${VERSION}.apk"
          ls -la *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickRecord-apk
          path: QuickRecord-*.apk
          retention-days: 90

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: QuickRecord-*.apk
          generate_release_notes: true
