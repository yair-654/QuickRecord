plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.israel.quickrecord'
    compileSdk 37

    defaultConfig {
        applicationId 'com.israel.quickrecord'
        minSdk 34
        targetSdk 37
        // Raise both on every release. versionCode must always go up, or
        // Android refuses to install the update over the old version.
        versionCode 20
        versionName '2.0'
    }

    signingConfigs {
        // Your own key, given by the build environment (see README). Without it
        // the release build falls back to the debug key so it still builds.
        release {
            def ksFile = System.getenv("QR_KEYSTORE_FILE")
            if (ksFile != null && file(ksFile).exists() && file(ksFile).length() > 0) {
                storeFile file(ksFile)
                storeType "PKCS12"
                storePassword System.getenv("QR_KEYSTORE_PASSWORD")
                keyAlias System.getenv("QR_KEY_ALIAS")
                keyPassword System.getenv("QR_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksFile = System.getenv("QR_KEYSTORE_FILE")
            if (ksFile != null && file(ksFile).exists() && file(ksFile).length() > 0) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig false
    }
}

dependencies {
    // Google's AndroidX libraries for the interface only. None of them adds
    // the INTERNET permission; the app still cannot open a network socket.
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
